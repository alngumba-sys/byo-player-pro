</style></head><body><div class="wrap">
<section id="login" class="login card hide">
  <h1>BYO Sales</h1><p class="mut">Sign in to see the customers you brought in.</p>

</section>
<section id="chg" class="login card hide">

  <label class="mut">New PIN (4 digits)</label><input id="np1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" style="letter-spacing:8px;font-size:22px;text-align:center">
  <label class="mut">Repeat new PIN</label><input id="np2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" style="letter-spacing:8px;font-size:22px;text-align:center">

</section>

  <header><div><h1 id="nm">BYO Sales</h1><div class="mut sm" id="pc"></div></div><button class="gh sm2" id="out">Sign out</button></header>
  <div id="msg"></div>

  <div class="card" id="ref"><div class="mut">Loading your account...</div></div>

  <div class="tiles" id="tiles"></div>
  <div id="funnel"></div>

  <div class="rowh" style="margin-top:6px"><h2 style="margin:0">Your customers</h2><button class="gh sm2" id="csvu">Customers CSV</button></div>
  <div class="bar"><div class="tabs" id="tabs"></div><input id="q" type="search" placeholder="Search name, ID, code or platform" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search customers"></div>
  <div id="list"></div>
</section></div>
<script>
(function(){
var URL_='https://lkftnbkuuitaxtlvrqfj.supabase.co', KEY='sb_publishable_D5tMkCSL1AVvJS8S9fuPgQ_nOg_ItOY', SITE='https://byoplayer-pair.netlify.app';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} return null}
function rpc(n,b){ return fetch(URL_+'/rest/v1/rpc/'+n,{method:'POST',headers:{'content-type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(b||{})}).then(function(r){return r.json()}).catch(function(){return {ok:false,error:'Could not reach the server. Check your internet.'}}); }
function fmt(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function dt(t){return t?new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'-'}
function money(o,pct){ var k=Object.keys(o||{}); if(!k.length) return '0'; return k.map(function(c){ var v=o[c]*(pct==null?1:pct/100); return fmt(v)+' '+c; }).join(' + '); }
function left(sec){ if(sec<=0) return 'ended'; var d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60); return d>0?(d+'d '+h+'h left'):(h>0?(h+'h '+m+'m left'):(m+' min left')); }
var tok=ls('bs_tok'), timer=null, J=null, gotAt=0, filter='all', busy={};
function show(v){ $('login').classList.toggle('hide',v!=='login'); $('chg').classList.toggle('hide',v!=='chg'); $('app').classList.toggle('hide',v!=='app'); }
function flash(t,cls){ $('msg').innerHTML=t?'<div class="banner '+(cls||'bad')+'">'+esc(t)+'</div>':''; if(t&&cls==='good') setTimeout(function(){ if($('msg').textContent===t) $('msg').innerHTML=''; },5000); }
function copy(txt,btn){ var done=function(){ var o=btn.textContent; btn.textContent='Copied'; setTimeout(function(){ btn.textContent=o; },1500); };
  try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); }
  function fb(){ try{ var t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }catch(e){ btn.textContent='Press and hold to copy'; } } }
function linkFor(code){ return SITE+'/get?ref='+encodeURIComponent(code); }

// ---- referral code: create once, then share ----
var checkT=null, chk={code:'',ok:false,msg:''};
function paintRef(){ var a=J.agent, el=$('ref');
  if(a.code_set&&a.code){ var L=linkFor(a.code);
    el.innerHTML='<h2>My Referral Link</h2><div class="mut sm">Your referral code</div><div class="codebox"><div>'+esc(a.code)+'</div><button class="gh" id="cc">Copy</button></div>'+
      '<div class="mut sm">Your referral link</div><div class="codebox link"><div>'+esc(L)+'</div><button class="gh" id="cl">Copy</button></div>'+
      '<div class="row"><button id="wa">Share on WhatsApp</button></div><div class="mut sm" style="margin-top:8px">Customers who open this link get your code filled in automatically. Your code is locked and cannot be changed.</div>';
    $('cc').onclick=function(){ copy(a.code,this); }; $('cl').onclick=function(){ copy(L,this); };
    $('wa').onclick=function(){ window.open('https://wa.me/?text='+encodeURIComponent('Watch live TV, football, movies and series with BYO Player. Free 7-day trial: '+L),'_blank','noopener'); };
    return; }
  if($('cin')&&el.getAttribute('data-mode')==='create') return;   // keep what is being typed
  el.setAttribute('data-mode','create');
  el.innerHTML='<h2>Create your referral code</h2><div class="mut sm">Choose it carefully: you can do this <b>only once</b>. It can never be changed or deleted afterwards.</div>'+
    '<input id="cin" style="font-size:clamp(26px,8vw,36px);font-weight:800;letter-spacing:3px;text-align:center;padding:18px 10px;border:2px solid var(--acc)" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. ALEX254"><div id="cmsg" class="sm mut" style="min-height:20px;margin:-4px 0 8px">4 to 20 letters or numbers.</div>'+
    '<button id="cgo" style="width:100%" disabled>Create my code</button>';
  var inp=$('cin'), go=$('cgo');
  inp.addEventListener('input',function(){ var v=inp.value.toUpperCase().replace(/[^A-Z0-9-]/g,''); if(inp.value!==v) inp.value=v; chk={code:v,ok:false}; go.disabled=true; go.textContent='Create my code'; go.setAttribute('data-sure','');
    clearTimeout(checkT); if(v.length<4){ $('cmsg').className='sm mut'; $('cmsg').textContent='4 to 20 letters or numbers.'; return; }
    $('cmsg').className='sm mut'; $('cmsg').textContent='Checking...';
    checkT=setTimeout(function(){ rpc('byo_sales_code_check',{p_token:tok,p_code:v}).then(function(r){ if(inp.value!==v) return;
      if(r&&r.auth){ signedOut(); return; }
      if(r&&r.locked){ load(); return; }
      if(r&&r.available){ chk={code:r.code,ok:true}; go.disabled=false; $('cmsg').className='sm ok'; $('cmsg').textContent=r.code+' is available.'; }
      else { $('cmsg').className='sm'; $('cmsg').style.color='var(--bad)'; $('cmsg').textContent=(r&&r.error)||'Could not check. Try again.'; } }); },350); });
  go.onclick=function(){ if(!chk.ok) return;
    if(go.getAttribute('data-sure')!=='1'){ go.setAttribute('data-sure','1'); go.textContent='Tap again to lock in '+chk.code+' forever'; return; }   // two taps: it cannot be undone
    go.disabled=true; rpc('byo_sales_set_code',{p_token:tok,p_code:chk.code}).then(function(r){
      if(r&&r.ok){ el.removeAttribute('data-mode'); flash('Your code '+r.code+' is ready to share.','good'); load(); }
      else { go.disabled=false; go.setAttribute('data-sure',''); go.textContent='Create my code'; $('cmsg').style.color='var(--bad)'; $('cmsg').textContent=(r&&r.error)||'Could not save.'; if(r&&r.locked) load(); } }); };
}

// ---- tiles ----
function RATE(a){ return (a&&a.rate!=null)?a.rate:100; }
function kes(n){ return 'KSh '+fmt(Math.round(Number(n||0))); }
function mths(n){ n=Number(n||0); return (Math.round(n*10)/10).toLocaleString(undefined,{maximumFractionDigits:1}); }
function paintTiles(){ var m=J.month, A=J.all_time, a=J.agent;
  $('tiles').innerHTML='<div class="card tile"><div class="l">Your commission in '+esc(m.label)+'</div><div class="v">'+esc(kes((m.commission||0)))+'</div><div class="s">'+mths(m.months)+' paid customer-month'+(Number(m.months)===1?'':'s')+' x '+esc(kes(RATE(a)))+'</div></div>'+
    '<div class="card tile"><div class="l">New users in '+esc(m.label)+'</div><div class="v">'+fmt(m.new_users)+'</div><div class="s">'+fmt(A.users)+' in total</div></div>'+
    '<div class="card tile"><div class="l">Total commission earned</div><div class="v">'+esc(kes((A.commission||0)))+'</div><div class="s">'+mths(A.months)+' paid month'+(Number(A.months)===1?'':'s')+' so far</div></div>'; }

// ---- customers ----
function elapsed(){ return Math.floor((Date.now()-gotAt)/1000); }
function secs(c){ return c.seconds_left==null?null:(c.seconds_left-elapsed()); }
function statusOf(c){ var s=secs(c); if((c.status==='trial'||c.status==='expiring')&&s!=null&&s<=0) return 'expired'; if(c.status==='trial'&&s!=null&&s<=172800) return 'expiring'; return c.status; }
var LABEL={pending:'Pending Activation',trial:'Trial Active',expiring:'Expiring Soon',paid:'Paid',expired:'Expired'};
var ACC={pending:'#fbbf24',trial:'#34d399',expiring:'#f87171',paid:'#34d399',expired:'#64748b'};
var TABS=[['all','All',function(){return true}],['pending','Pending Activation',function(s){return s==='pending'}],['trial','Trial Active',function(s){return s==='trial'||s==='expiring'}],['paid','Paid',function(s){return s==='paid'}]];
var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var ICON={cp:SV+'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  web:SV+'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  and:SV+'<path d="M6 17v-6a6 6 0 0 1 12 0v6a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M9 5 7.5 2.5M15 5l1.5-2.5"/><path d="M9.5 11h.01M14.5 11h.01"/></svg>',
  tv:SV+'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>'};
function plat(p){ p=String(p||''); return /android/i.test(p)?ICON.and:(/web/i.test(p)?ICON.web:ICON.tv); }
function d1(t,short){ if(!t) return '-'; return new Date(t).toLocaleDateString('en-GB',short?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}); }
function sh(sec){ if(sec==null) return ''; if(sec<=0) return 'ended'; var d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60); return d>0?(d+'d'):(h>0?(h+'h'):(m+'m')); }
function flashOk(el){ el.classList.add('ok'); setTimeout(function(){ el.classList.remove('ok'); },1200); }
function qcopy(txt,el){ var done=function(){ flashOk(el); };
  try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); }
  function fb(){ try{ var t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }catch(e){} } }
function paintList(){ var C=J.customers||[];
  $('tabs').innerHTML=TABS.map(function(t){ var n=C.filter(function(c){return t[2](statusOf(c))}).length; return '<button class="tab'+(filter===t[0]?' on':'')+'" data-f="'+t[0]+'">'+t[1]+' ('+n+')</button>'; }).join('');
  [].forEach.call($('tabs').children,function(b){ b.onclick=function(){ filter=b.getAttribute('data-f'); paintList(); }; });
  var fn=TABS.filter(function(t){return t[0]===filter})[0][2], qq=(($('q')||{}).value||'').trim().toLowerCase();
  var rows=C.filter(function(c){ if(!fn(statusOf(c))) return false; if(!qq) return true;
    return [c.tv_id,CODES[c.rid],c.platform,labelOf(c.rid)].some(function(f){ return String(f||'').toLowerCase().indexOf(qq)>=0; }); });
  if(!rows.length){ $('list').innerHTML='<div class="card empty">'+(C.length?(qq?'No customers match that search.':'No customers in this group.'):'No customers yet. Share your referral link to get started.')+'</div>'; return; }
  $('list').innerHTML=rows.map(function(c){ var st=statusOf(c), s=secs(c), P=c.payments||[], rid=esc(c.rid), code=CODES[c.rid];
    var lab=labelOf(c.rid), idpart='<span class="idt" data-cp="'+esc(c.tv_id)+'" title="Copy device ID">'+esc(c.tv_id)+'</span><button class="cp" data-cp="'+esc(c.tv_id)+'" aria-label="Copy device ID" title="Copy device ID">'+ICON.cp+'</button>';
    var idc=lab?('<span class="idc nm2"><span class="lbn" title="'+esc(lab)+'">'+esc(lab)+'</span><span class="idl">'+idpart+'</span></span>'):('<span class="idc">'+idpart+'</span>');
    var codeCol=!c.activated?(code?('<button class="cb" data-cp="'+esc(code)+'" title="Copy activation code" aria-label="Activation code '+esc(code)+'"><span class="lb"><i>Code</i>'+(CODEEXP[c.rid]!=null?'<em class="tm" data-tm="'+rid+'">'+tmFmt(codeLeft(c.rid))+'</em>':'')+'</span><b>'+esc(code)+'</b></button>'):'<span class="nc">No code</span>'):'<span class="dash">—</span>';
    var when=c.activated?c.activated_at:c.referred_at, wl=c.activated?'Activated ':'Installed ';
    var c3='<span class="pf" title="'+esc(c.platform||'')+'">'+plat(c.platform)+'</span><span class="dl">'+wl+esc(d1(when))+'</span><span class="ds">'+esc(d1(when,true))+'</span>';
    var timed=c.activated&&s!=null&&(st==='trial'||st==='expiring'||st==='paid');
    var c4='<span class="pill '+st+'">'+LABEL[st]+'</span>'+(timed?('<span class="chip'+(st==='expiring'?' hot':'')+'"><span class="l">'+esc(left(s))+'</span><span class="sh">'+esc(sh(s))+'</span></span>'):'');
    var canRx=c.activated&&(st==='trial'||st==='expiring'||st==='paid');
    var btn=!c.activated?('<button class="bt" data-a="'+rid+'"'+(busy[c.rid]?' disabled':'')+'>'+(busy[c.rid]?'Activating...':'Activate')+'</button>')
        :(canRx?(limHit(c.rid)?('<button class="bt nd" disabled title="New device limit reached. Contact BYO support.">Limit</button>'):('<button class="bt nd" data-rx="'+rid+'">New device</button>')):'');
    var rxp=(canRx&&rxOpen[c.rid])?('<div class="rxrow"><div class="act" style="margin-top:0"><input class="rxin" data-i="'+rid+'" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Code" value="'+esc(rxVal[c.rid]||'')+'" style="flex:0 0 100px;text-align:center;font-size:18px;letter-spacing:4px"><button data-rg="'+rid+'"'+(busy['rx'+c.rid]?' disabled':'')+'>'+(busy['rx'+c.rid]?'Reactivating...':'Reactivate')+'</button><button class="ghost" data-rc="'+rid+'">Cancel</button></div><div class="mut sm" style="margin-top:4px">Type the 4 digit code now showing on the customer\'s new screen.</div></div>'):'';
    var det='';
    if(ptOpen[c.rid]){ var L=['<b>'+esc(LABEL[st])+'</b>'+(timed?' \u00b7 '+esc(left(s)):'')+(c.platform?' \u00b7 '+esc(c.platform):''),'Device ID '+esc(c.tv_id)+' \u00b7 Installed '+esc(d1(c.referred_at))];
      if(c.activated) L.push('Activated '+esc(d1(c.activated_at))+(c.delivered?'':' (waiting for the app)'));
      if(c.months>0) L.push(esc(mths(c.months))+' paid months \u00b7 '+esc(kes(c.commission)));
      if(canRx&&MORE&&MORE.react_limit!=null) L.push('New device used '+reactN(c.rid)+' of '+MORE.react_limit+' times in the last 30 days');
      var nm=MORE?('<div class="nmrow"><input class="nmin" data-n="'+rid+'" maxlength="60" placeholder="Name or phone number" value="'+esc(lab)+'" aria-label="Customer name or phone number"><button class="sm2" data-ns="'+rid+'"'+(busy['nm'+c.rid]?' disabled':'')+'>Save</button></div>'):'';
      det='<div class="dd">'+nm+L.join('<br>')+(P.length?('<div class="payl">'+P.map(function(p){ return '<div class="pay"><span>'+esc(dt(p.at))+' \u00b7 '+esc(p.method||'')+'</span><b>'+esc(fmt(p.amount)+' '+(p.currency||''))+'</b><span class="mut">Ref '+esc(p.ref||'-')+'</span><span class="mut" style="text-align:right">'+esc(p.plan||'')+(p.from?(' \u00b7 '+esc(dt(p.from))+' to '+esc(dt(p.until))):'')+'</span></div>'; }).join('')+'</div>'):'')+'</div>'; }
    return '<div class="it"><div class="dv" data-r="'+rid+'" style="--ac:'+ACC[st]+'">'+idc+codeCol+'<div class="c3">'+c3+'</div><div class="c4">'+c4+'</div><div class="c5">'+btn+'</div></div>'+rxp+det+'</div>'; }).join('');
  [].forEach.call($('list').querySelectorAll('[data-a]'),function(b){ b.onclick=function(){ activate(b.getAttribute('data-a')); }; });
  [].forEach.call($('list').querySelectorAll('[data-rx]'),function(b){ b.onclick=function(){ rxOpen[b.getAttribute('data-rx')]=1; paintList(); var i=$('list').querySelector('.rxin[data-i="'+b.getAttribute('data-rx')+'"]'); if(i) i.focus(); }; });
  [].forEach.call($('list').querySelectorAll('[data-rc]'),function(b){ b.onclick=function(){ var k=b.getAttribute('data-rc'); delete rxOpen[k]; delete rxVal[k]; paintList(); }; });
  [].forEach.call($('list').querySelectorAll('[data-rg]'),function(b){ b.onclick=function(){ reactivate(b.getAttribute('data-rg')); }; });
  [].forEach.call($('list').querySelectorAll('.rxin'),function(i){ i.oninput=function(){ i.value=i.value.replace(/[^0-9]/g,'').slice(0,4); rxVal[i.getAttribute('data-i')]=i.value; };
    i.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); reactivate(i.getAttribute('data-i')); } }; });
  [].forEach.call($('list').querySelectorAll('[data-ns]'),function(b){ b.onclick=function(){ saveLabel(b.getAttribute('data-ns')); }; });
  [].forEach.call($('list').querySelectorAll('.nmin'),function(i){ i.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); saveLabel(i.getAttribute('data-n')); } }; }); }
$('list').addEventListener('click',function(e){ var t=e.target;
  var cp=t.closest&&t.closest('[data-cp]'); if(cp){ qcopy(cp.getAttribute('data-cp'),cp.classList.contains('idt')?cp.nextSibling||cp:cp); return; }
  if(t.closest&&t.closest('button,input,.dd,.rxrow')) return;
  var row=t.closest&&t.closest('.dv'); if(row){ var k=row.getAttribute('data-r'); if(ptOpen[k]) delete ptOpen[k]; else ptOpen[k]=1; paintList(); } });
$('q').addEventListener('input',function(){ if(J) paintList(); });
var MORE=null;
function labelOf(rid){ return (MORE&&MORE.labels&&MORE.labels[rid])||''; }
function reactN(rid){ return Number((MORE&&MORE.react&&MORE.react[rid])||0); }
function limHit(rid){ return !!(MORE&&MORE.react_limit!=null&&reactN(rid)>=MORE.react_limit); }
function typing(){ var ae=document.activeElement; return !!(ae&&ae.classList&&(ae.classList.contains('rxin')||ae.classList.contains('nmin'))); }
function loadMore(){ return rpc('byo_sales_more',{p_token:tok}).then(function(j){ if(j&&j.ok){ MORE=j; paintFunnel(); paintPayouts(); if(!typing()&&J) paintList(); } }).catch(function(){}); }
function saveLabel(rid){ var i=$('list').querySelector('.nmin[data-n="'+rid+'"]'); if(!i||busy['nm'+rid]) return; var v=i.value.trim(); busy['nm'+rid]=1;
  rpc('byo_sales_label',{p_token:tok,p_rid:rid,p_label:v}).then(function(r){ delete busy['nm'+rid];
    if(r&&r.auth){ signedOut(); return; }
    if(r&&r.ok){ MORE=MORE||{}; MORE.labels=MORE.labels||{}; if(r.label) MORE.labels[rid]=r.label; else delete MORE.labels[rid]; flash(r.label?'Saved.':'Name removed.','good'); }
    else flash((r&&r.error)||'Could not save.','bad');
    paintList(); }); }
function pct(a,b){ return b>0?Math.round(a*100/b)+'%':'-'; }
function paintFunnel(){ var el=$('funnel'); if(!MORE||!MORE.funnel){ el.innerHTML=''; return; } var f=MORE.funnel;
  el.innerHTML='<div class="fun"><div class="st"><div class="l">Installs</div><div class="v">'+fmt(f.installs)+'</div><div class="p">from your link</div></div><span class="ar">›</span>'+
    '<div class="st"><div class="l">Activated</div><div class="v">'+fmt(f.activated)+'</div><div class="p">'+pct(f.activated,f.installs)+' of installs</div></div><span class="ar">›</span>'+
    '<div class="st"><div class="l">Paid</div><div class="v">'+fmt(f.paid)+'</div><div class="p">'+pct(f.paid,f.activated)+' of activated</div></div></div>'; }
var poM=false, poH=false;
function paintPayouts(){ var el=$('payouts'); if(!MORE||!MORE.payouts){ el.innerHTML=''; return; } var P=MORE.payouts, owed=Number(P.owed||0), mo=P.months||[], it=P.items||[];
  el.innerHTML='<div class="card po"><div class="rowh" style="margin:0"><h2 style="margin:0">Payouts</h2><button class="gh sm2" id="csvc">Commissions CSV</button></div>'+
    '<div class="pos"><div><div class="l">Earned</div><div class="v">'+esc(kes(P.earned))+'</div></div><div><div class="l">Paid out</div><div class="v">'+esc(kes(P.paid_out))+'</div></div><div><div class="l">'+(owed<0?'Overpaid':'Still owed')+'</div><div class="v '+(owed>0?'warn':'okc')+'">'+esc(kes(Math.abs(owed)))+'</div></div></div>'+
    '<details id="pom"'+(poM?' open':'')+'><summary>Month by month</summary><div class="mrow h"><span>Month</span><span class="r">Earned</span><span class="r">Paid out</span><span class="r">Owed</span></div>'+
      mo.map(function(m){ return '<div class="mrow"><span>'+esc(m.label)+'</span><span class="r">'+fmt(m.earned)+'</span><span class="r">'+fmt(m.paid)+'</span><span class="r">'+fmt(m.owed)+'</span></div>'; }).join('')+'</details>'+
    '<details id="poh"'+(poH?' open':'')+'><summary>Payments received from BYO ('+it.filter(function(x){return !x.voided}).length+')</summary>'+
      (it.length?it.map(function(x){ return '<div class="hrow'+(x.voided?' vd':'')+'"><span>'+esc(d1(x.paid_at))+' · '+esc(x.period)+(x.method?' · '+esc(x.method):'')+(x.ref?' · '+esc(x.ref):'')+'</span><b>'+esc(kes(x.amount))+'</b></div>'; }).join(''):'<div class="mut sm" style="padding:6px 0">Nothing paid out yet.</div>')+'</details></div>';
  $('pom').ontoggle=function(){ poM=this.open; }; $('poh').ontoggle=function(){ poH=this.open; };
  $('csvc').onclick=function(){ var rows=[['Month','Earned (KSh)','Paid out (KSh)','Owed (KSh)']].concat(mo.map(function(m){ return [m.period,m.earned,m.paid,m.owed]; }));
    rows.push([]); rows.push(['Payments received','Month','Amount (KSh)','Method','Reference','Note']);
    it.filter(function(x){return !x.voided}).forEach(function(x){ rows.push([iso(x.paid_at),x.period,x.amount,x.method||'',x.ref||'',x.note||'']); });
    rows.push([]); rows.push(['Total earned',P.earned,'Total paid out',P.paid_out,'Owed',P.owed]);
    download('byo-commissions-'+today()+'.csv',csv(rows)); }; }
function today(){ return new Date().toISOString().slice(0,10); }
function csvCell(v){ v=String(v==null?'':v); if(/^=|^@|^[+\-][^0-9\s]/.test(v)) v="'"+v; return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function csv(rows){ return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n'); }
function download(name,text){ var b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600); }
function iso(t){ return t?new Date(t).toISOString().slice(0,10):''; }
$('csvu').onclick=function(){ if(!J) return; var rows=[['Name or phone','Device ID','Platform','Status','Installed','Activated','Access ends','Paid months','Commission (KSh)']];
  (J.customers||[]).forEach(function(c){ rows.push([labelOf(c.rid),c.tv_id,c.platform||'',LABEL[statusOf(c)]||'',iso(c.referred_at),iso(c.activated_at),iso(c.ends_at),c.months||0,c.commission||0]); });
  download('byo-customers-'+today()+'.csv',csv(rows)); };
var rxOpen={}, rxVal={}, ptOpen={}, CODES={}, CODEEXP={};
function codeLeft(r){ return Math.max(0,Math.round((CODEEXP[r]-Date.now())/1000)); }
function tmFmt(n){ return Math.floor(n/60)+':'+('0'+(n%60)).slice(-2); }
var tmDone=false;
setInterval(function(){ var any=false; [].forEach.call(document.querySelectorAll('[data-tm]'),function(e){ any=true; var n=codeLeft(e.getAttribute('data-tm')); e.textContent=tmFmt(n); e.className='tm'+(n<=60?' h':(n<=180?' w':'')); if(n<=0&&!tmDone){ tmDone=true; loadCodes(); } else if(n>0) tmDone=false; }); },1000);
function reactivate(rid){ var code=(rxVal[rid]||'').replace(/[^0-9]/g,''); if(busy['rx'+rid]) return;
  if(code.length!==4){ flash('Type the 4 digit code shown on the customer\'s screen.','bad'); return; }
  busy['rx'+rid]=1; flash(''); paintList();
  rpc('byo_sales_reactivate',{p_token:tok,p_rid:rid,p_code:code}).then(function(r){ delete busy['rx'+rid];
    if(r&&r.auth){ signedOut(); return; }
    if(r&&r.ok){ delete rxOpen[rid]; delete rxVal[rid]; flash('Reactivated on the new device. Their app will connect within a minute.','good'); }
    else flash((r&&r.error)||'Could not reactivate.','bad');
    load(); }); }

function activate(rid){ if(busy[rid]) return; busy[rid]=1; flash(''); paintList();
  rpc('byo_sales_activate',{p_token:tok,p_rid:rid}).then(function(r){ delete busy[rid];
    if(r&&r.auth){ signedOut(); return; }
    if(r&&r.ok){ flash(r.already?'Already activated.':'Activated. Their app will connect within a minute.','good'); }
    else flash((r&&r.error)||'Could not activate.','bad');
    load(); }); }

function paint(){ var a=J.agent; $('nm').textContent=a.name; $('pc').textContent='Commission: '+kes(RATE(a))+' per customer, per paid month'; paintRef(); paintTiles(); paintList(); }
function signedOut(){ ls('bs_tok',null); tok=null; clearInterval(timer); show('login'); }
function load(){ return rpc('byo_sales_dash',{p_token:tok}).then(function(j){ if(!j||!j.ok){ if(j&&j.auth) signedOut(); else if(j&&(j.error||j.message)) flash(j.error||'The sales system is being updated. Please try again in a little while.','bad'); return; } J=j; gotAt=Date.now(); show('app'); paint(); loadCodes(); loadMore(); }); }
function loadCodes(){ if(!J||!(J.customers||[]).some(function(c){return !c.activated;})){ CODES={}; CODEEXP={}; return; }
  rpc('byo_sales_codes',{p_token:tok}).then(function(j){ if(j&&j.ok){ var now=Date.now(), ex={}, sc=j.secs||{}; Object.keys(sc).forEach(function(k){ ex[k]=now+Number(sc[k])*1000; }); CODEEXP=ex;
      var n=JSON.stringify(j.codes||{}); if(n!==JSON.stringify(CODES)){ CODES=j.codes||{}; if(!typing()) paintList(); } else { [].forEach.call(document.querySelectorAll('[data-tm]'),function(e){ e.textContent=tmFmt(codeLeft(e.getAttribute('data-tm'))); }); } } }).catch(function(){}); }
function start(){ show('app'); load(); clearInterval(timer); timer=setInterval(function(){ if(document.hidden) return; if(typing()) return; if(Date.now()-gotAt>60000) load(); else if(J){ paintList(); loadCodes(); } },20000); }
var firstPw='';
$('go').onclick=function(){ var b=$('go'); b.disabled=true; $('err').textContent=''; var pwv=$('pw').value; rpc('byo_sales_login',{p_email:$('em').value,p_password:pwv}).then(function(j){ b.disabled=false;
    if(j&&j.ok){ tok=j.token; $('pw').value=''; if(j.must_change){ firstPw=pwv; show('chg'); } else { ls('bs_tok',tok); start(); } }
    else $('err').textContent=(j&&j.error)||'Could not sign in.'; }); };
$('cgo2').onclick=function(){ var a=$('np1').value, c=$('np2').value, e=$('cerr'); e.textContent=''; if(!/^[0-9]{4}$/.test(a)){ e.textContent='The PIN must be exactly 4 digits (numbers only).'; return; } if(a!==c){ e.textContent='The two PINs are not the same.'; return; } if(a===firstPw){ e.textContent='Choose a different PIN from the one you were given.'; return; }
  $('cgo2').disabled=true; rpc('byo_sales_change_password',{p_token:tok,p_old:firstPw,p_new:a}).then(function(j){ $('cgo2').disabled=false; if(j&&j.ok){ firstPw=''; ls('bs_tok',tok); $('np1').value=$('np2').value=''; start(); } else e.textContent=(j&&j.error)||'Could not save.'; }); };
['np1','np2'].forEach(function(i){ $(i).addEventListener('input',function(){ var v=this.value.replace(/\D/g,'').slice(0,4); if(this.value!==v) this.value=v; }); $(i).addEventListener('keydown',function(e){ if(e.key==='Enter') $('cgo2').click(); }); });
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });
$('out').onclick=function(){ rpc('byo_sales_logout',{p_token:tok}); signedOut(); };
if(tok) start(); else show('login');
})();
</script></body></html>
